<g class="rd-text">
<text x="210.0" y="23.5" text-anchor="middle" font-size="12">OF</text>
<text x="255.0" y="23.5" text-anchor="middle" font-size="12">CF</text>
<text x="439.5" y="23.5" text-anchor="middle" font-size="12">操作数</text>
<text x="120.0" y="39.5" text-anchor="middle" font-size="12">之前 SHL</text>
<text x="444.0" y="39.5" text-anchor="middle" font-size="12">10001000100010001000100010001111</text>
<text x="102.0" y="55.5" text-anchor="middle" font-size="12">或 SAL</text>
<text x="115.5" y="71.5" text-anchor="middle" font-size="12">之后 SHL</text>
<text x="205.5" y="71.5" text-anchor="middle" font-size="8.280000000000001">1</text>
<text x="250.5" y="71.5" text-anchor="middle" font-size="8.280000000000001">1</text>
<text x="444.0" y="71.5" text-anchor="middle" font-size="12">00010001000100010001000100011110</text>
<text x="637.5" y="71.5" text-anchor="middle" font-size="8.280000000000001">0</text>
<text x="124.5" y="87.5" text-anchor="middle" font-size="12">或 SAL 由 1</text>
<text x="115.5" y="103.5" text-anchor="middle" font-size="12">之后 SHL</text>
<text x="250.5" y="103.5" text-anchor="middle" font-size="8.280000000000001">0</text>
<text x="444.0" y="103.5" text-anchor="middle" font-size="12">00100010001000100011110000000000</text>
<text x="637.5" y="103.5" text-anchor="middle" font-size="8.280000000000001">0</text>
<text x="129.0" y="119.5" text-anchor="middle" font-size="12">或 SAL 由 10</text>
