<g class="rd-text rd-vertical">
</g>
<g class="rd-note" font-size="11">
<text x="12" y="222" fill="currentColor">SHL（同义助记符 SAL）把寄存器或内存操作数中的位左移指定的位数。CF 接收从</text>
<text x="12" y="240" fill="currentColor">操作数左端移出的最后一位；空出的低位补 0。这些指令可作用于字节、字和双字。</text>
